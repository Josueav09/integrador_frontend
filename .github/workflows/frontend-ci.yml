name: Frontend CI (React & Vitest)

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm install

      - name: Run linter
        run: |
          npm run lint || echo "Linter failed, but continuing build"

      - name: Run unit tests (Vitest)
        run: |
          npm run test:run

      - name: Verify production build
        run: |
          npm run build
